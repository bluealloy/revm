name: Tests

concurrency:
  cancel-in-progress: true
  group: ${{github.workflow}}-${{github.ref}}

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

env:
  CARGO_TERM_COLOR: always
  NODE_OPTIONS: --no-network-family-autoselection
  SFW_UNKNOWN_HOST_ACTION: ignore
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

permissions: {}

jobs:
  test:
    permissions:
      contents: read
      id-token: write
    name: test ${{ matrix.rust }} ${{ matrix.flags }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.91", "stable", "nightly"]
        flags: ["--no-default-features", "", "--all-features"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@5338a3746a2ac2ddd88cbede733c79f907aca3a0
        with:
          egress-policy: audit
      - name: Verify Socket Cargo interception
        uses: ./.github/actions/check-socket-shim
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@nextest
      - name: Install GMP (all-features)
        if: contains(matrix.flags, '--all-features')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev
      - run: cargo nextest run --workspace ${{ matrix.flags }}

  ethereum-tests:
    permissions:
      contents: read
      id-token: write
    name: eth ${{ matrix.profile }} ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [ethtests, release]
        target: [i686-unknown-linux-gnu, x86_64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@5338a3746a2ac2ddd88cbede733c79f907aca3a0
        with:
          egress-policy: audit
      - name: Verify Socket Cargo interception
        uses: ./.github/actions/check-socket-shim
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Install cross
        run: cargo install cross --locked
      - name: Run tests
        run: ./scripts/run-tests.sh clean cross ${{ matrix.profile }} ${{ matrix.target }}

  check-no-std:
    permissions:
      contents: read
      id-token: write
    name: check no_std ${{ matrix.target }} ${{ matrix.features }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ["riscv32imac-unknown-none-elf", "riscv64imac-unknown-none-elf"]
        features: [""]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@5338a3746a2ac2ddd88cbede733c79f907aca3a0
        with:
          egress-policy: audit
      - name: Verify Socket Cargo interception
        uses: ./.github/actions/check-socket-shim
      - run: |
          cargo check --target ${{ matrix.target }} --no-default-features --features=${{ matrix.features }}
          cargo check --target ${{ matrix.target }} -p revm-database --no-default-features

  check:
    permissions:
      contents: read
      id-token: write
    name: check ${{ matrix.features }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features: ["", "serde", "std", "std,map-foldhash"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@5338a3746a2ac2ddd88cbede733c79f907aca3a0
        with:
          egress-policy: audit
      - name: Verify Socket Cargo interception
        uses: ./.github/actions/check-socket-shim
      - run: cargo check --no-default-features -p revm --features=${{ matrix.features }}

  feature-checks:
    permissions:
      contents: read
      id-token: write
    name: features
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@5338a3746a2ac2ddd88cbede733c79f907aca3a0
        with:
          egress-policy: audit
      - name: Verify Socket Cargo interception
        uses: ./.github/actions/check-socket-shim
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Install GMP
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev
      - name: cargo hack
        run: cargo hack check --feature-powerset --depth 1

  clippy:
    permissions:
      contents: read
      id-token: write
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@5338a3746a2ac2ddd88cbede733c79f907aca3a0
        with:
          egress-policy: audit
      - name: Verify Socket Cargo interception
        uses: ./.github/actions/check-socket-shim
      - name: Install GMP
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev
      - run: cargo +nightly clippy --workspace --all-targets --all-features
        env:
          RUSTFLAGS: -Dwarnings

  docs:
    permissions:
      contents: read
      id-token: write
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-docs
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@5338a3746a2ac2ddd88cbede733c79f907aca3a0
        with:
          egress-policy: audit
      - name: Verify Socket Cargo interception
        uses: ./.github/actions/check-socket-shim
      - name: Install GMP
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev
      - run: cargo doc --workspace --all-features --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"

  doctest:
    permissions:
      contents: read
      id-token: write
    name: doctest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@5338a3746a2ac2ddd88cbede733c79f907aca3a0
        with:
          egress-policy: audit
      - name: Verify Socket Cargo interception
        uses: ./.github/actions/check-socket-shim
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - run: cargo test --workspace --doc

  fmt:
    permissions:
      contents: read
      id-token: write
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@5338a3746a2ac2ddd88cbede733c79f907aca3a0
        with:
          egress-policy: audit
      - name: Verify Socket Cargo interception
        uses: ./.github/actions/check-socket-shim
      - run: cargo +nightly fmt --all --check

  feature-propagation:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@5338a3746a2ac2ddd88cbede733c79f907aca3a0
        with:
          egress-policy: audit
      - name: Verify Socket Cargo interception
        uses: ./.github/actions/check-socket-shim
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1
      - run: sccache --start-server
      - uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: zepter
      - name: Eagerly pull dependencies
        run: cargo metadata --format-version=1 --locked > /dev/null
      - run: zepter run check

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check all

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@4d9c206a77c041268485162b8e2579ad7a5cb9a3 # v1.50.0

  ci-success:
    name: ci success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - test
      - ethereum-tests
      - check-no-std
      - check
      - feature-checks
      - clippy
      - docs
      - doctest
      - fmt
      - feature-propagation
      - deny
      - typos
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
