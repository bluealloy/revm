name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cargo_features:
        description: "Optional Cargo features for cargo codspeed build, e.g. revm-precompile/gmp"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  codspeed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
      - name: Install cargo-codspeed
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2.85.8
        with:
          tool: cargo-codspeed
      - name: Build the benchmark target(s)
        env:
          CARGO_FEATURES: ${{ inputs.cargo_features }}
        run: |
          if [ -n "$CARGO_FEATURES" ]; then
            cargo codspeed build --profile profiling --workspace --exclude '*example*' --features "$CARGO_FEATURES"
          else
            cargo codspeed build --profile profiling --workspace --exclude '*example*'
          fi
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@0ca9cbbf4623b599a6c3ed4fc8a922942705d9f1 # v5.0.2
        with:
          run: cargo codspeed run --workspace
          token: ${{ secrets.CODSPEED_TOKEN }}
          mode: simulation
